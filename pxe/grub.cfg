# GRUB configuration for UEFI PXE boot of XCP-ng 8.3.
# Installer le DHCP pour servir EFI/xcp-ng/grubx64.efi (voir docs/DEPLOIEMENT-PXE.md).

set default=0
set timeout=10

menuentry "XCP-ng Install (serial, unattended)" {
    multiboot2 /EFI/xcp-ng/xen.gz dom0_mem=2048M,max:2048M watchdog dom0_max_vcpus=4 com1=115200,8n1 console=com1,vga
    module2 /EFI/xcp-ng/vmlinuz console=hvc0 console=tty0 answerfile_device=eth0 answerfile=http://10.0.0.10/xcp-ng/answerfile.xml install
    module2 /EFI/xcp-ng/install.img
}

menuentry "XCP-ng Install (serial, manual)" {
    multiboot2 /EFI/xcp-ng/xen.gz dom0_mem=2048M,max:2048M watchdog dom0_max_vcpus=4 com1=115200,8n1 console=com1,vga
    module2 /EFI/xcp-ng/vmlinuz console=hvc0 console=tty0
    module2 /EFI/xcp-ng/install.img
}
