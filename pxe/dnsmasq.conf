# Extrait dnsmasq - DHCP + TFTP pour XCP-ng 8.3 (BIOS et UEFI).
interface=eth0
listen-address=10.0.0.10,127.0.0.1
bind-interfaces

dhcp-range=10.0.0.100,10.0.0.200,12h
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1

# client-arch 7 = UEFI x86_64
dhcp-match=set:xcp-uefi,option:client-arch,7
dhcp-boot=tag:xcp-uefi,EFI/xcp-ng/grubx64.efi,,10.0.0.10
dhcp-boot=tag:!xcp-uefi,pxelinux.0,,10.0.0.10

enable-tftp
tftp-root=/srv/tftp
